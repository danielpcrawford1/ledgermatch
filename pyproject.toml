[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgermatch"
version = "0.2.0"
description = "Offline CSV transaction reconciliation for bookkeepers and small businesses."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ledgermatch = "ledgermatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
